<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Cubic Bézier curve</title>
  <desc id="description">A luminous curve with two endpoints and two offset control points on a dark grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="1" stop-color="#151126"/>
    </linearGradient>
    <linearGradient id="curve" x1="118" y1="548" x2="1082" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36d7ff"/>
      <stop offset="0.52" stop-color="#a77bff"/>
      <stop offset="1" stop-color="#ff66c4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a77bff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#a77bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#dbeafe" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="620" cy="310" r="360" fill="url(#glow)"/>
  <path d="M118 548L330 86M1082 500L822 112" fill="none" stroke="#cbd5e1" stroke-opacity=".34" stroke-width="5" stroke-dasharray="12 14"/>
  <path d="M118 548C330 86 822 112 1082 500" fill="none" stroke="#8b5cf6" stroke-opacity=".3" stroke-width="36" filter="url(#soft-glow)"/>
  <path d="M118 548C330 86 822 112 1082 500" fill="none" stroke="url(#curve)" stroke-width="18" stroke-linecap="round"/>
  <g fill="#0b1220" stroke-width="9">
    <circle cx="118" cy="548" r="20" stroke="#36d7ff"/>
    <circle cx="330" cy="86" r="18" stroke="#f8fafc"/>
    <circle cx="822" cy="112" r="18" stroke="#f8fafc"/>
    <circle cx="1082" cy="500" r="20" stroke="#ff66c4"/>
  </g>
</svg>
